name: Build add-on

# Builds one image per architecture (armv7, aarch64, amd64) and pushes them to GHCR
# as "ghcr.io/<owner>/<arch>-addon-menu-planner:<version>" (matches `image:` in addon/config.yaml).
# Pull requests build but do not push. Raspberry Pi 3/4/5 (armv7 / aarch64) are first-class targets.
#
# Not using home-assistant/builder's prepare-multi-arch-matrix: it only accepts amd64 and aarch64,
# and build-image has no platform input, so armv7 must be built explicitly with QEMU.

on:
  push:
    branches: [main]
    paths:
      - "addon/**"
      - ".github/workflows/build-addon.yaml"
  pull_request:
    paths:
      - "addon/**"
      - ".github/workflows/build-addon.yaml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-addon-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: addon-menu-planner
  REGISTRY: ghcr.io

jobs:
  version:
    name: Read add-on version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: read
        run: |
          version="$(sed -n 's/^version: *"\{0,1\}\([^"]*\)"\{0,1\}$/\1/p' addon/config.yaml)"
          if [[ -z "${version}" ]]; then
            echo "::error::Could not read version from addon/config.yaml"
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Add-on version: ${version}"

  build:
    name: Build ${{ matrix.arch }}
    needs: version
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            platform: linux/amd64
          - arch: aarch64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
          - arch: armv7
            runner: ubuntu-24.04
            platform: linux/arm/v7
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up QEMU
        if: matrix.arch == 'armv7'
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image name
        id: image
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          echo "name=${REGISTRY}/${OWNER,,}/${{ matrix.arch }}-${IMAGE_NAME}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./addon
          file: ./addon/Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: |
            BUILD_ARCH=${{ matrix.arch }}
          labels: |
            io.hass.type=app
            io.hass.arch=${{ matrix.arch }}
            io.hass.version=${{ needs.version.outputs.version }}
            io.hass.name=Menu Planner
            io.hass.description=Plan healthy dinners, track stock and manage the menu
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.version.outputs.version }}
          tags: |
            ${{ steps.image.outputs.name }}:${{ needs.version.outputs.version }}
            ${{ steps.image.outputs.name }}:latest
          push: ${{ github.event_name != 'pull_request' }}
          pull: true
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
