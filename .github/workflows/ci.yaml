name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: Lint and test (add-on)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            addon/requirements.txt
            addon/requirements-dev.txt
      - name: Install add-on dependencies
        run: pip install -r addon/requirements.txt -r addon/requirements-dev.txt
      - name: Ruff
        run: |
          ruff check addon tests
          ruff format --check addon tests
      - name: Add-on tests
        run: PYTHONPATH=addon python -m pytest -q --ignore=tests/integration

  integration:
    name: Integration tests (Home Assistant)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install test dependencies
        run: |
          pip install -r addon/requirements.txt -r addon/requirements-dev.txt
          pip install pytest-homeassistant-custom-component
      - name: Integration tests
        run: python -m pytest -q tests/integration

  panel:
    name: Panel and Lovelace card tests/build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/panel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/panel/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run build:cards

  hassfest:
    name: Hassfest and HACS validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@86d4564712fa02543c808e3a693dd04f9d3f8361 # master
      - uses: hacs/action@d556e736723344f83838d08488c983a15381059a # 22.5.0
        with:
          category: integration
          ignore: brands
